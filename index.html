<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Два тренировочных теста по истории искусства. В каждом 33 вопроса, есть задания с изображениями и разбор ответов.">
<title>Тренировочные тесты по истории искусства</title>
<style>
:root { color-scheme:light; --paper:#f3f3f9; --ink:#23283a; --mute:#535a70; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:var(--paper); font:1rem/1.55 system-ui,sans-serif; }
.wrap { width:min(100%,64rem); margin:auto; padding-inline:clamp(1rem,5vw,3rem); }
header { padding:clamp(2.5rem,8vw,5.5rem) 0 2.25rem; background:#221c3e; color:white; border-bottom:5px solid #a892db; }
h1 { margin:0; font:500 clamp(2.4rem,7vw,4.65rem)/1.08 Georgia,serif; letter-spacing:-.035em; max-width:18ch; }
header p { margin:.8rem 0 0; color:#e7ddfa; font-size:1.1rem; }
main { padding-block:clamp(1.4rem,5vw,3rem); }
.variants { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
.variant { display:block; padding:1.25rem 1.35rem; border-radius:.75rem; color:white; text-decoration:none; }
.variant:first-child { background:#483584; }
.variant:last-child { background:#305584; }
.variant strong { font:500 clamp(1.6rem,4vw,2.2rem)/1.2 Georgia,serif; }
.variant span { display:block; margin-top:.5rem; text-decoration:underline; text-underline-offset:.2em; }
.variant:focus-visible { outline:3px solid #282344; outline-offset:4px; }
.variant:hover { filter:brightness(1.1); }
.note { color:var(--mute); max-width:65ch; margin:1.25rem 0 0; }
@media (max-width:32rem) { .variants { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Тренировочные тесты по истории искусства</h1>
    <p>По материалам курса «Как стать искусствоведом»</p>
  </div>
</header>
<main class="wrap">
  <nav class="variants" aria-label="Варианты теста">
    <a class="variant" href="variant-1.html"><strong>Вариант 1</strong><span>Открыть тест</span></a>
    <a class="variant" href="variant-2.html"><strong>Вариант 2</strong><span>Открыть тест</span></a>
  </nav>
  <p class="note">В каждом варианте 33 вопроса и максимум 55 баллов. Можно запустить таймер на 75 минут. После завершения откроется разбор ответов.</p>
</main>
</body>
</html>
